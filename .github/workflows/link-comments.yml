name: Link citations in comments

# Generated by AnnotateEPC (build-site); every publication replaces this file.
# Turns citations such as "Art. 84" or "F-IV, 4.6" in new or edited comments into links.
# Editing other people's comments needs the owner's token: secret COMMENT_LINKER_TOKEN, a
# fine-grained personal access token for this repository only, permission Discussions:
# read and write (the built-in GITHUB_TOKEN may not edit comments it did not write).

on:
  discussion_comment:
    types: [created, edited]
  workflow_dispatch:   # all comments

permissions:
  discussions: write
  contents: read

concurrency: link-comments

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - run: python3 .github/scripts/link_comments.py
        env:
          GITHUB_TOKEN: ${{ secrets.COMMENT_LINKER_TOKEN || secrets.GITHUB_TOKEN }}
